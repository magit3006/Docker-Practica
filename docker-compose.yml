services:
  web:
    image: nginx:1.27
    container_name: lamp_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./php
    container_name: lamp_php
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./src/forja-heroes/php/forja.ini:/usr/local/etc/php/conf.d/zz-forja.ini:ro
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: lamp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Sobri_3008
      MYSQL_USER: manucl
      MYSQL_PASSWORD: Sobri_3008
      MYSQL_DATABASE: lamp_db
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lamp_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data: